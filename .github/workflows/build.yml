name: Build Android APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: App icon (only if icon.png exists)
        if: hashFiles('icon.png') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert icon.png -background none -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon-only.png
          if [ -f icon-foreground.png ]; then convert icon-foreground.png -background none -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon-foreground.png; fi
          if [ -f icon-background.png ]; then convert icon-background.png -resize '1024x1024!' assets/icon-background.png; fi
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk hisabi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hisabi-apk
          path: hisabi.apk
      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Hisabi build ${{ github.run_number }}
          files: hisabi.apk
          make_latest: true
