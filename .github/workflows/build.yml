name: Build Android APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Create app icons
        run: |
          for f in icon.png icon-foreground.png icon-background.png; do
            if [ ! -f "$f" ]; then echo "ERROR: $f repository-te nei. Upload koren."; exit 1; fi
          done
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d l a <<< "$spec"
            mkdir -p "$RES/mipmap-$d"
            convert icon.png -resize ${l}x${l} "$RES/mipmap-$d/ic_launcher.png"
            convert icon.png -resize ${l}x${l} \( -size ${l}x${l} xc:black -fill white -draw "circle $((l/2)),$((l/2)) $((l/2)),0" \) -alpha off -compose CopyOpacity -composite "$RES/mipmap-$d/ic_launcher_round.png"
            convert icon-foreground.png -resize ${a}x${a} "$RES/mipmap-$d/hisabi_fg.png"
            convert icon-background.png -resize "${a}x${a}!" "$RES/mipmap-$d/hisabi_bg.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          for n in ic_launcher ic_launcher_round; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@mipmap/hisabi_bg"/>' '    <foreground android:drawable="@mipmap/hisabi_fg"/>' '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/$n.xml"
          done
          ls "$RES"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk hisabi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hisabi-apk
          path: hisabi.apk
      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Hisabi build ${{ github.run_number }}
          files: hisabi.apk
          make_latest: true
